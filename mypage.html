<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/tablet.css">
    <title>마이페이지 진입화면</title>
</head>
<body>
    <div id="mypage">
        <div class="wrap">                
            <header class="header">
                <div class="header-in">
                    <div class="header-left">
                        <div class="thum" style="display: none;">
                            <img src="./img/header/back-arrow.png">
                        </div>
                    </div>
                    <div class="header-tit">
                        <h5>MY</h5>
                    </div>
                    <div class="header-right">
                        <div class="thum left" style="display: none;"> <!--아이콘 두개일때 활성화(display:none지우면됨)-->
                            <img src="./img/header/header-timer.png">
                        </div>
                        <div class="thum" style="display: none;"> <!--아이콘 한개일때 활성화-->
                            <img src="./img/header/search.png">
                        </div>
                        <p style="display: none;">삭제</p> <!--글자버튼일때 활성화-->
                        <select style="display: none;"> <!--랭킹 : 셀렉박스일때 활성화-->
                            <option value="default">광명점 랭킹</option>
                            <option value="state">신분</option>
                        </select>
                    </div>
                </div>
            </header>
            <div class="header-calender" style="display: none;">
                <div class="calendar-container">
                    <div class="calendar-header">
                      <button class="prev-month"><img src="./img/calender/calender-prev.png" /></button>
                      <span class="current-month">2025년 4월</span>
                      <button class="next-month"><img src="./img/calender/calender-next.png" /></button>
                    </div>
                  
                    <div class="weekday-header">
                      <div>월</div>
                      <div>화</div>
                      <div>수</div>
                      <div>목</div>
                      <div>금</div>
                      <div>토</div>
                      <div>일</div>
                    </div>
                  
                    <div class="calendar-wrapper">
                      <div class="calendar-slider"></div>
                    </div>
                  </div>
                <div class="calender-open">
                    <button type="button" class="cal-btn"></button>
                </div>    
            </div>

            <main class="main layout">
                <div class="bottom-menu">
                    <div class="bottom-in">
                        <div class="bottom-item">
                            <img src="./img/bottom-menu/bottom-home.png">
                            <p>홈</p>
                        </div>
                        <div class="bottom-item">
                            <img src="./img/bottom-menu/bottom-study.png">
                            <p>학습기록</p>
                        </div>
                        <div class="bottom-item">
                            <img src="./img/bottom-menu/bottom-content.png">
                            <p>콘텐츠</p>
                        </div>
                        <div class="bottom-item on">
                            <img src="./img/bottom-menu/bottom-my-selected.png">
                            <p>MY</p>
                        </div>
                    </div>
                </div>    
                <div class="main-con">
                    <div class="in">
                        <div class="sec-area">
                            <div class="profile-box">
                                <img src="./img/mypage/user.png">
                                <button><img src="./img/mypage/qr.png"><span>입장용 QR</span></button>
                            </div>
                            <div class="user-info">
                                <div class="info">
                                    <p>이름</p>
                                    <p class="value">홍길동</p>
                                </div>
                                <div class="info">
                                    <p>입실 지점</p>
                                    <p class="value">광명점</p>
                                </div>
                                <div class="info">
                                    <p>사물함 정보</p>
                                    <p class="value">A21</p>
                                </div>
                                <div class="info">
                                    <p>좌석 위치</p>
                                    <p class="value">[좌석명]</p>
                                </div>
                                <div class="info">
                                    <p>사용 중인 이용권</p>
                                    <p class="value">[자유] 시간권 50시간</p>
                                </div>
                                <div class="info">
                                    <p>입실시간</p>
                                    <p class="value">오후 12시 30분</p>
                                </div>
                                <div class="info">
                                    <p>잔여 이용 시간</p>
                                    <p class="value">45시간 50분</p>
                                </div>
                                <div class="info">
                                    <p>사용 기한</p>
                                    <p class="value">2025년 12월 31일</p>
                                </div>
                            </div>    
                        </div>
                    </div>
                    <div class="my-btn-area">
                        <div class="my-btn">
                            <div class="in">
                                <p>보유 이용권</p>
                                <img src="./img/mypage/arrow-next.png">
                            </div>
                        </div>
                        <div class="my-btn">
                            <div class="in">
                                <p>결제 정보</p>
                                <img src="./img/mypage/arrow-next.png">
                            </div>
                        </div>
                        <div class="my-btn">
                            <div class="in">
                                <p>입/퇴실 내역</p>
                                <img src="./img/mypage/arrow-next.png">
                            </div>
                        </div>
                        <div class="my-btn">
                            <div class="in">
                                <p>개인정보 수정</p>
                                <img src="./img/mypage/arrow-next.png">
                            </div>
                        </div>
                    </div>
                    <p class="center-tel">고객센터<br>1599-8230</p>
                    <p class="logout">로그아웃</p>
                </div>
            </main>
        </div>
    </div>



<script>
</script>

</body>
</html>
