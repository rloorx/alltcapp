<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/tablet.css">
    <title>타이머화면</title>
</head>
<body>
    <div id="timer">
        <div class="wrap">                
            <header class="header">
                <div class="header-in">
                    <div class="header-left">
                        <div class="thum">
                            <img src="./img/header/back-arrow.png">
                        </div>
                    </div>
                    <div class="header-tit">
                        <h5>타이머</h5>
                    </div>
                    <div class="header-right">
                        <div class="thum left"> <!--아이콘 두개일때 활성화(display:none지우면됨)-->
                            <img src="./img/header/header-timer.png">
                        </div>
                        <div class="thum"> <!--아이콘 한개일때 활성화-->
                            <img src="./img/header/header-setting.png">
                        </div>
                        <p style="display: none;">삭제</p> <!--글자버튼일때 활성화-->
                        <select style="display: none;"> <!--랭킹 : 셀렉박스일때 활성화-->
                            <option value="default">광명점 랭킹</option>
                            <option value="state">신분</option>
                        </select>
                    </div>
                </div>
            </header>
            <div class="header-calender">
                <div class="calendar-container">
                    <div class="calendar-header">
                      <button class="prev-month"><img src="./img/calender/calender-prev.png" /></button>
                      <span class="current-month">2025년 4월</span>
                      <button class="next-month"><img src="./img/calender/calender-next.png" /></button>
                    </div>
                  
                    <div class="weekday-header">
                      <div>월</div>
                      <div>화</div>
                      <div>수</div>
                      <div>목</div>
                      <div>금</div>
                      <div>토</div>
                      <div>일</div>
                    </div>
                  
                    <div class="calendar-wrapper">
                      <div class="calendar-slider"></div>
                    </div>
                  </div>
                <div class="calender-open">
                    <button type="button" class="cal-btn"></button>
                </div>    
            </div>

            <main class="main layout">
                <div class="bottom-menu">
                    <div class="bottom-in">
                        <div class="bottom-item on">
                            <img src="./img/bottom-menu/bottom-home-selected.png">
                            <p>홈</p>
                        </div>
                        <div class="bottom-item">
                            <img src="./img/bottom-menu/bottom-study.png">
                            <p>학습기록</p>
                        </div>
                        <div class="bottom-item">
                            <img src="./img/bottom-menu/bottom-content.png">
                            <p>콘텐츠</p>
                        </div>
                        <div class="bottom-item">
                            <img src="./img/bottom-menu/bottom-my.png">
                            <p>MY</p>
                        </div>
                    </div>
                </div>    
                <div class="main-con">
                    <div class="sec sec1">
                        <div class="in">
                            <h1>01:59:58</h1>
                            <p><strong>총 휴식 시간</strong><span style="display: block;">00:00:00</span></p>
                        </div>
                    </div>
                    <div class="in">
                        <div class="sec sec2">
                            <div class="timer-tit">
                                <p class="font"><strong>타이머 목록</strong></p>
                                <div class="timer-toggle">
                                    <div class="status"><img src="./img/timer/tomato.png"><span>뽀모도로</span></div>
                                    <div class="toggle-switch"></div>
                                </div>
                            </div>
                            <div class="sec-area"><!--오늘 타이머-->
                                <div class="timer-con">
                                    <div class="timer-name">
                                        <img src="./img/timer/timer-pink.png">
                                        <h5>국어</h5>
                                    </div>
                                    <div class="time">
                                        <h5>00:59:59</h5>
                                    </div>
                                </div>
                                <div class="timer-con">
                                    <div class="timer-name">
                                        <img src="./img/timer/timer-blue.png">
                                        <h5>영어</h5>
                                    </div>
                                    <div class="time">
                                        <h5>00:59:59</h5>
                                    </div>
                                </div>
                                <div class="timer-con">
                                    <div class="timer-name">
                                        <img src="./img/timer/timer-green.png">
                                        <h5>수학</h5>
                                    </div>
                                    <div class="time">
                                        <h5>00:59:59</h5>
                                    </div>
                                </div>
                            </div>
                            <div class="sec-area past" style="display: none;"><!--과거 타이머-->
                                <div class="timer-con">
                                    <div class="timer-name">
                                        <img src="./img/timer/timerpast-pink.png">
                                        <h5>국어</h5>
                                    </div>
                                    <div class="time">
                                        <h5>00:59:59</h5>
                                    </div>
                                </div>
                                <div class="timer-con">
                                    <div class="timer-name">
                                        <img src="./img/timer/timerpast-blue.png">
                                        <h5>영어</h5>
                                    </div>
                                    <div class="time">
                                        <h5>00:59:59</h5>
                                    </div>
                                </div>
                                <div class="timer-con">
                                    <div class="timer-name">
                                        <img src="./img/timer/timerpast-green.png">
                                        <h5>수학</h5>
                                    </div>
                                    <div class="time">
                                        <h5>00:59:59</h5>
                                    </div>
                                </div>
                            </div>
                            <div class="category-btn">
                                <button>+ 학습 카테고리 편집</button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
        <div class="modal"></div>
        <div class="bottom-tab timer-icon"> <!--타이머 아이콘 눌렀을때 바텀시트-->
            <div class="bottom-tab-tit">
                <h5>타이머 설정</h5>
            </div>
            <div class="bottom-tab-menu">
                <div class="menu">
                    <p>화면 꺼짐 방지</p>
                    <div class="bottom-toggle">
                        <div class="bottom-toggle-switch"></div>
                    </div>
                </div>
                <div class="menu menu02">
                    <div class="menu-tit">
                        <p>다른 앱 사용</p>
                        <p class="menu-info">타이머 측정 시 사용가능한 어플리케이션을 추가합니다.</p>
                    </div>
                    <img src="./img/timer/arrow-next.png">
                </div>
            </div>
        </div>
        <div class="bottom-tab pomodoro"> <!--뽀모도로 눌렀을때 바텀시트-->
            <div class="bottom-tab-tit">
                <h5>뽀모도로 설정</h5>
            </div>
            <div class="bottom-tab-menu">
                <div class="menu">
                    <p>집중 시간</p>
                    <div class="timer-set">
                        <span>-</span>
                        <span class="time">25분</span>
                        <span>+</span>
                    </div>
                </div>
                <div class="menu">
                    <p>휴식 시간</p>
                    <div class="timer-set">
                        <span>-</span>
                        <span class="time">5분</span>
                        <span>+</span>
                    </div>
                </div>
            </div>
        </div>
    </div>



<script>
//토글, 바텀시트
const timerToggle = document.querySelector('.timer-toggle');
const toggleSwitch = timerToggle.querySelector('.toggle-switch');
const pomodoroSet = document.querySelector('.bottom-tab.pomodoro');
const modal = document.querySelector('.modal');

toggleSwitch.addEventListener('click', () => {
  const isOn = timerToggle.classList.contains('on');
  if (!isOn) {
    modal.classList.add("on");
    pomodoroSet.classList.add("on");
  }
  timerToggle.classList.toggle('on');
});

const bottomToggle = document.querySelector('.bottom-toggle');
const bottomSwitch = bottomToggle.querySelector('.bottom-toggle-switch');

bottomSwitch.addEventListener('click', () => {
    bottomToggle.classList.toggle('on');
});

const headerSet = document.querySelector('.header-right .left');
const timerSet = document.querySelector('.bottom-tab.timer-icon');

headerSet.addEventListener("click", ()=>{
    modal.classList.add("on");
    timerSet.classList.add("on");
});

modal.addEventListener("click", () => {
    modal.classList.remove("on");
    timerSet.classList.remove("on");
    pomodoroSet.classList.remove("on");
});


// 과거타이머일때 버튼 숨기기
function updateCategoryBtnVisibility() {
    const pastSection = document.querySelector('.sec-area.past');
    const categoryBtn = document.querySelector('.category-btn');

    if (pastSection && window.getComputedStyle(pastSection).display !== 'none') {
      categoryBtn.style.display = 'none';
    } else {
      categoryBtn.style.display = 'block';
    }
  }

  // 예: 어떤 토글이나 버튼으로 과거 타이머 표시 전환 시
  // 아래 함수가 호출되면 동작
  updateCategoryBtnVisibility(); // 처음에 한 번 실행

  // 예시: 과거 타이머를 보여줄 때
  document.querySelector('.some-toggle-btn')?.addEventListener('click', () => {
    document.querySelector('.sec-area.past').style.display = 'block'; // 예: 과거 타이머 보이게
    updateCategoryBtnVisibility(); // 버튼 표시 상태 업데이트
  });




// 달력(main이랑 달라진거없음)
const daysDisplay = ['월', '화', '수', '목', '금', '토', '일'];
let currentDate = new Date();

function renderCalendar(date) {
  const slider = document.querySelector('.calendar-slider');
  slider.innerHTML = '';

  const year = date.getFullYear();
  const month = date.getMonth();

  const rawFirstDay = new Date(year, month, 1).getDay();
  const firstDay = (rawFirstDay + 6) % 7;

  const lastDate = new Date(year, month + 1, 0).getDate();
  const prevLastDate = new Date(year, month, 0).getDate();

  const today = new Date();
  const totalCells = (firstDay + lastDate <= 35) ? 35 : 42;

  for (let i = 0; i < totalCells; i++) {
    const item = document.createElement('div');
    item.className = 'date-item';

    let cellDate;

    if (i < firstDay) {
      const day = prevLastDate - (firstDay - i - 1);
      cellDate = new Date(year, month - 1, day);
      item.classList.add('other-month');
    } else if (i >= firstDay + lastDate) {
      const day = i - (firstDay + lastDate) + 1;
      cellDate = new Date(year, month + 1, day);
      item.classList.add('other-month');
    } else {
      const day = i - firstDay + 1;
      cellDate = new Date(year, month, day);
    }

    const dayIndex = cellDate.getDay();
    const dayLabel = daysDisplay[(dayIndex + 6) % 7]; 

    const dateStr = `${cellDate.getDate()}`;

    item.innerHTML = `
      <span class="day">${dayLabel}</span>
      <span class="date">${dateStr}</span>
    `;

    if (
      cellDate.getFullYear() === today.getFullYear() &&
      cellDate.getMonth() === today.getMonth() &&
      cellDate.getDate() === today.getDate()
    ) {
        item.classList.add('today');
    }

        slider.appendChild(item);
    }
  // 상단 월 텍스트 갱신
    document.querySelector('.current-month').textContent = `${year}년 ${month + 1}월`;

  // 슬라이드 보기일 때만 오늘을 중앙 정렬 (왜잘안돼!!!!)
    const wrapper = document.querySelector('.calendar-wrapper');
    if (!document.querySelector('.calendar-container').classList.contains('expanded')) {
        setTimeout(() => {
        const todayEl = document.querySelector('.today');
        if (wrapper && todayEl) {
            const wrapperRect = wrapper.getBoundingClientRect();
            const todayRect = todayEl.getBoundingClientRect();
            const offset = todayEl.offsetLeft - (wrapperRect.width / 2) + (todayRect.width / 2);
            wrapper.scrollLeft = offset;
        }
        }, 100);
    }
}

// 초기 렌더링
renderCalendar(currentDate);

// 이전/다음 달 이동
document.querySelector('.prev-month').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar(currentDate);
});
document.querySelector('.next-month').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar(currentDate);
});

// 달력 펼침/접힘
document.querySelector('.calender-open button').addEventListener('click', () => {
    const wrapper = document.querySelector('.calendar-container');
    wrapper.classList.toggle('expanded');
    renderCalendar(currentDate); // 상태 바뀌면 다시 그리기
});    

//접힌상태에서 7일 노출(이것또한잘안되는중)
function updateItemWidths() {
const container = document.querySelector('.header-calender');
const items = document.querySelectorAll('.calendar-slider .date-item');
const containerWidth = container.clientWidth;
const itemWidth = containerWidth / 7;

items.forEach(item => {
    item.style.width = `${itemWidth}px`;
});
}

// 렌더 직후 호출
renderCalendar(currentDate);
updateItemWidths();

// 반응형 처리
window.addEventListener('resize', updateItemWidths);


</script>

</body>
</html>
