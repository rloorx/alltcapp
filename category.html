<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/tablet.css">
    <title>학습카테고리 편집화면</title>
</head>
<body>
    <div id="category">
        <div class="wrap">                
            <header class="header">
                <div class="header-in">
                    <div class="header-left">
                        <div class="thum">
                            <img src="./img/header/back-arrow.png">
                        </div>
                    </div>
                    <div class="header-tit">
                        <h5>학습 카테고리 편집</h5>
                    </div>
                    <div class="header-right">
                        <div class="thum left" style="display: none;"> <!--아이콘 두개일때 활성화(display:none지우면됨)-->
                            <img src="./img/header/header-timer.png">
                        </div>
                        <div class="thum" style="display: none;"> <!--아이콘 한개일때 활성화-->
                            <img src="./img/header/notify.png">
                        </div>
                        <p style="display: none;">삭제</p> <!--글자버튼일때 활성화-->
                        <select style="display: none;"> <!--랭킹 : 셀렉박스일때 활성화-->
                            <option value="default">광명점 랭킹</option>
                            <option value="state">신분</option>
                        </select>
                    </div>
                </div>
            </header>
            <div class="header-calender" style="display: none;">
                <div class="calendar-container">
                    <div class="calendar-header">
                      <button class="prev-month"><img src="./img/calender/calender-prev.png" /></button>
                      <span class="current-month">2025년 4월</span>
                      <button class="next-month"><img src="./img/calender/calender-next.png" /></button>
                    </div>
                  
                    <div class="weekday-header">
                      <div>월</div>
                      <div>화</div>
                      <div>수</div>
                      <div>목</div>
                      <div>금</div>
                      <div>토</div>
                      <div>일</div>
                    </div>
                  
                    <div class="calendar-wrapper">
                      <div class="calendar-slider"></div>
                    </div>
                  </div>
                <div class="calender-open">
                    <button type="button" class="cal-btn"></button>
                </div>    
            </div>

            <main class="main layout">
                <div class="bottom-menu">
                    <div class="bottom-in">
                        <div class="bottom-item on">
                            <img src="./img/bottom-menu/bottom-home-selected.png">
                            <p>홈</p>
                        </div>
                        <div class="bottom-item">
                            <img src="./img/bottom-menu/bottom-study.png">
                            <p>학습기록</p>
                        </div>
                        <div class="bottom-item">
                            <img src="./img/bottom-menu/bottom-content.png">
                            <p>콘텐츠</p>
                        </div>
                        <div class="bottom-item">
                            <img src="./img/bottom-menu/bottom-my.png">
                            <p>MY</p>
                        </div>
                    </div>
                </div>    
                <div class="main-con">
                    <div class="in">
                        <div class="sec-area show">
                            <div class="sec-con">
                                <div class="sec-tit">
                                    <div class="pink"></div>
                                    <p><strong>국어</strong></p>
                                </div>
                                <div class="sec-menu">
                                    <p>숨김</p>
                                    <img src="./img/category/arrow-updown.png">
                                </div>
                            </div>
                            <div class="sec-con">
                                <div class="sec-tit">
                                    <div class="green"></div>
                                    <p><strong>영어</strong></p>
                                </div>
                                <div class="sec-menu">
                                    <p>숨김</p>
                                    <img src="./img/category/arrow-updown.png">
                                </div>
                            </div>
                            <div class="sec-con">
                                <div class="sec-tit">
                                    <div class="blue"></div>
                                    <p><strong>수학</strong></p>
                                </div>
                                <div class="sec-menu">
                                    <p>숨김</p>
                                    <img src="./img/category/arrow-updown.png">
                                </div>
                            </div>
                        </div>
                        <div class="sec-area hide">
                            <p><strong>숨김 목록</strong></p>
                            <div class="sec-con">
                                <div class="sec-tit">
                                    <div class="purple"></div>
                                    <p><strong>과학</strong></p>
                                </div>
                                <div class="sec-menu">
                                    <p>삭제</p>
                                    <p class="last">보이기</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <div class="bottom-btn"><!--클릭시 : 카테고리 추가 팝업 표시 (팝업 레이아웃: login.html 파일)-->
                <img src="./img/btn/category-btn.png">
            </div>
        </div>
    </div>



<script>
</script>

</body>
</html>
