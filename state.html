<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/tablet.css">
    <title>신분 선택 화면</title>
</head>
<body>
    <div id="state">
        <div class="wrap">                
            <header class="header">
                <div class="header-in">
                    <div class="header-left">
                        <div class="thum">
                            <img src="./img/header/close.png">
                        </div>
                    </div>
                    <div class="header-tit">
                        <h5>신분 태그 선택</h5>
                    </div>
                    <div class="header-right">
                        <div class="thum left" style="display: none;"> <!--아이콘 두개일때 활성화(display:none지우면됨)-->
                            <img src="./img/header/header-timer.png">
                        </div>
                        <div class="thum" style="display: none;"> <!--아이콘 한개일때 활성화-->
                            <img src="./img/header/header-setting.png">
                        </div>
                        <p style="display: none;">삭제</p> <!--글자버튼일때 활성화-->
                        <select style="display: none;"> <!--랭킹 : 셀렉박스일때 활성화-->
                            <option value="default">광명점 랭킹</option>
                            <option value="state">신분</option>
                        </select>
                    </div>
                </div>
            </header>
            <main class="main">
                <div class="in">
                    <div class="state-area">
                        <div class="state-box">
                            <p>고1</p>
                        </div>
                        <div class="state-box">
                            <p>고2</p>
                        </div>
                        <div class="state-box">
                            <p>고3 / N수생</p>
                        </div>
                        <div class="state-box">
                            <p>대학생</p>
                        </div>
                        <div class="state-box">
                            <p>편준생</p>
                        </div>
                        <div class="state-box">
                            <p>PEET</p>
                        </div>
                        <div class="state-box">
                            <p>LEET</p>
                        </div>
                        <div class="state-box">
                            <p>MDEET</p>
                        </div>
                        <div class="state-box">
                            <p>로스쿨</p>
                        </div>
                        <div class="state-box">
                            <p>의대 / 의전원</p>
                        </div>
                        <div class="state-box">
                            <p>대학원</p>
                        </div>
                        <div class="state-box">
                            <p>공시생</p>
                        </div>
                        <div class="state-box">
                            <p>임용 유아</p>
                        </div>
                        <div class="state-box">
                            <p>임용 초등</p>
                        </div>
                        <div class="state-box">
                            <p>임용 중등</p>
                        </div>
                        <div class="state-box">
                            <p>임용 특수</p>
                        </div>
                        <div class="state-box">
                            <p>공인중개사</p>
                        </div>
                        <div class="state-box">
                            <p>회계사</p>
                        </div>
                        <div class="state-box">
                            <p>세무사</p>
                        </div>
                        <div class="state-box">
                            <p>관세사</p>
                        </div>
                        <div class="state-box">
                            <p>법무사</p>
                        </div>
                        <div class="state-box">
                            <p>노무사</p>
                        </div>
                        <div class="state-box">
                            <p>감정평가사</p>
                        </div>
                        <div class="state-box">
                            <p>변리사</p>
                        </div>
                        <div class="state-box">
                            <p>취준생</p>
                        </div>
                        <div class="state-box">
                            <p>직장인</p>
                        </div>
                        <div class="state-box">
                            <p>어학</p>
                        </div>
                        <div class="state-box">
                            <p>자격증</p>
                        </div>
                        <div class="state-box">
                            <p>기타</p>
                        </div>
                    </div>
                    <div class="btn-area">
                        <div class="in">
                            <button type="button">저장</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>



    <script>
        document.querySelectorAll('.state-box').forEach(box => {
        box.addEventListener('click', () => {
            const isActive = box.classList.contains('on');

            document.querySelectorAll('.state-box').forEach(el => el.classList.remove('on'));

            if (!isActive) {
            box.classList.add('on');
            }

            const hasOn = Array.from(document.querySelectorAll('.state-box')).some(el => el.classList.contains('on'));

            document.querySelectorAll('.btn-area button').forEach(btn => {
            if (hasOn) {
                btn.classList.add('on');
            } else {
                btn.classList.remove('on');
            }
            });
        });
        }); 
    </script>
</body>
</html>
