<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/tablet.css">
    <title>D-Day 등록, 학습 목표 등록 화면</title>
</head>
<body>
    <div id="daypicker">
        <div class="wrap">                
            <header class="header">
                <div class="header-in">
                    <div class="header-left">
                        <div class="thum">
                            <img src="./img/header/close.png">
                        </div>
                    </div>
                    <div class="header-tit">
                        <h5>D-Day 등록</h5>
                    </div>
                    <div class="header-right">
                        <div class="thum left" style="display: none;"> <!--아이콘 두개일때 활성화(display:none지우면됨)-->
                            <img src="./img/header/header-timer.png">
                        </div>
                        <div class="thum" style="display: none;"> <!--아이콘 한개일때 활성화-->
                            <img src="./img/header/header-setting.png">
                        </div>
                        <p>삭제</p> <!--글자버튼일때 활성화-->
                        <select style="display: none;"> <!--랭킹 : 셀렉박스일때 활성화-->
                            <option value="default">광명점 랭킹</option>
                            <option value="state">신분</option>
                        </select>
                    </div>
                </div>
            </header>
            <div class="header-calender">
                <div class="calendar-container">
                    <div class="calendar-header">
                      <button class="prev-month"><img src="./img/calender/calender-prev.png" /></button>
                      <span class="current-month">2025년 4월</span>
                      <button class="next-month"><img src="./img/calender/calender-next.png" /></button>
                    </div>
                  
                    <div class="weekday-header">
                      <div>월</div>
                      <div>화</div>
                      <div>수</div>
                      <div>목</div>
                      <div>금</div>
                      <div>토</div>
                      <div>일</div>
                    </div>
                  
                    <div class="calendar-wrapper">
                      <div class="calendar-slider"></div>
                    </div>
                  </div>
                <div class="calender-open">
                    <button type="button" class="cal-btn"></button>
                </div>    
            </div>

            <main class="main layout">
                <div class="bottom-menu">
                    <div class="bottom-in">
                        <div class="bottom-item on">
                            <img src="./img/bottom-menu/bottom-home-selected.png">
                            <p>홈</p>
                        </div>
                        <div class="bottom-item">
                            <img src="./img/bottom-menu/bottom-study.png">
                            <p>학습기록</p>
                        </div>
                        <div class="bottom-item">
                            <img src="./img/bottom-menu/bottom-content.png">
                            <p>콘텐츠</p>
                        </div>
                        <div class="bottom-item">
                            <img src="./img/bottom-menu/bottom-my.png">
                            <p>MY</p>
                        </div>
                    </div>
                </div>    
                <div class="main-con">
                    <div class="sec sec1">
                        <div class="in">
                            <div class="daypick">
                                <div class="daypick-con">
                                    <p><strong>D-Day 제목</strong></p>
                                    <input type="text" placeholder="D-Day 이름을 작성해 주세요.">
                                </div>
                                <div class="daypick-con">
                                    <p><strong>D-Day 계산 방법</strong></p>
                                    <div class="day-input pick on">
                                        <div class="txt-area"><input type="radio" name="date" checked><span>날짜 입력</span></div>
                                        <div class="daypick-box"><div class="input-box"><span>2025년 6월 12일</span></div></div>
                                    </div>
                                    <div class="day-input pick">
                                        <div class="txt-area"><input type="radio" name="date"><span>남은 일 수 입력</span></div>
                                        <div class="daypick-box"><input type="text"><span>일 뒤</span></div>
                                    </div>
                                </div>
                                <div class="daypick-con">
                                    <div class="day-input">
                                        <p><strong>시간 설정</strong></p>
                                        <div class="daypick-box">
                                            <div class="input-box"><span>오전 00시 00분</span></div>
                                            <span>기준</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="daypick">
                                <div class="daypick-color">
                                    <p>컬러 선택</p>
                                    <div class="color-pick">
                                        <div class="white on"></div>
                                        <div class="pinkgra"></div>
                                        <div class="greengra"></div>
                                        <div class="yellowgra"></div>
                                        <div class="bluegra"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="btn-area">
                                <button class="on">저장</button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
        <div class="modal"></div>
        <div class="dday-pick-bottom">
            <div class="select-div">
                <div class="select-box">
                    <ul id="year">
                    </ul>
                </div>
                <div class="select-box">
                    <ul id="month">
                    </ul>
                </div>
                <div class="select-box">
                    <ul id="day">
                    </ul>
                </div>
            </div>
            <button>확인</button>
        </div>

        <div class="dday-pick-bottom time-bottom">
            <div class="select-div">
                <div class="select-box">
                    <ul id="daytime">
                    </ul>
                </div>
                <div class="select-box">
                    <ul id="hour">
                    </ul>
                </div>
                <div class="select-box">
                    <ul id="minute">
                    </ul>
                </div>
            </div>
            <button>확인</button>
        </div>

    </div>



<script type="text/javascript">
    const boxes = document.querySelectorAll('.white, .pinkgra, .greengra, .yellowgra, .bluegra');

    boxes.forEach(box => {
    box.addEventListener('click', () => {
        boxes.forEach(b => b.classList.remove('on'));
        box.classList.add('on');
    });
    });

    const radios = document.querySelectorAll('input[type="radio"][name="date"]');

    radios.forEach(radio => {
        radio.addEventListener('change', () => {
            document.querySelectorAll('.day-input.pick').forEach(el => el.classList.remove('on'));
            radio.closest('.day-input.pick').classList.add('on');
        });
    });

document.querySelectorAll('.daypick-box .input-box').forEach(selectbox => {
    selectbox.addEventListener('click',()=>{
        document.querySelector('.dday-pick-bottom').classList.toggle('on');
        document.querySelector('.modal').classList.toggle('on');
    })
});

document.querySelector('.modal').addEventListener('click', () => {
  const picker = document.querySelector('.dday-pick-bottom');
  const modal = document.querySelector('.modal');

  if (picker.classList.contains('on')) {
    picker.classList.remove('on');
    modal.classList.remove('on');
  }
});

//디데이피커처럼
window.addEventListener('DOMContentLoaded', () => {
  const yearUl = document.querySelector('#year');
  const monthUl = document.querySelector('#month');
  const dayUl = document.querySelector('#day');

  const currentDate = new Date();
  const currentYear = currentDate.getFullYear();
  const currentMonth = currentDate.getMonth() + 1;
  const currentDay = currentDate.getDate();

  function createList(ul, start, end, activeValue, unitText, infinite = false) {
    if (!ul) return;

    const baseLis = [];
    for (let i = start; i <= end; i++) {
      const li = document.createElement('li');
      li.dataset.value = i;
      li.textContent = `${i}${unitText}`;
      baseLis.push(li);
    }

    if (!infinite) {
      ul.innerHTML = '';
      baseLis.forEach(li => ul.appendChild(li));

      const activeLi = Array.from(ul.children).find(li => Number(li.dataset.value) === activeValue);
      if (activeLi) activeLi.classList.add('active');

      setTimeout(() => {
        const liHeight = ul.querySelector('li')?.offsetHeight || 46.19;
        if (!activeLi) return;
        const liIndex = Array.from(ul.children).indexOf(activeLi);
        const scrollTo = liHeight * Math.max(liIndex, 0); 
        ul.scrollTo({ top: scrollTo, behavior: 'auto' });
      }, 0);

    } else {
      const repeatCount = 5;
      const fragment = document.createDocumentFragment();

      for (let i = 0; i < repeatCount; i++) {
        baseLis.forEach(li => {
          fragment.appendChild(li.cloneNode(true));
        });
      }

      ul.innerHTML = '';
      ul.appendChild(fragment);

      const allLis = Array.from(ul.children);
      const baseLength = end - start + 1;

      allLis.forEach(li => li.classList.remove('active'));
      const firstSetLis = allLis.slice(0, baseLength);
      const activeLi = firstSetLis.find(li => Number(li.dataset.value) === activeValue);
      if (activeLi) activeLi.classList.add('active');

      setTimeout(() => {
        const liHeight = ul.querySelector('li')?.offsetHeight || 46.19;
        if (!activeLi) return;
        const liIndex = allLis.indexOf(activeLi);
        const scrollTo = liHeight * Math.max(liIndex - 1, 0);
        ul.scrollTo({ top: scrollTo, behavior: 'auto' });
      }, 0);
    }
  }

  createList(yearUl, 1900, 2100, currentYear, '년', false);
  createList(monthUl, 1, 12, currentMonth, '월', true);
  createList(dayUl, 1, 31, currentDay, '일', true);

  document.querySelectorAll('.select-box').forEach(selectBox => {
    const ul = selectBox.querySelector('ul');
    let liList = Array.from(ul.querySelectorAll('li'));
    const liHeight = liList[0]?.offsetHeight || 46.19;

    const updateActive = () => {
      const baseY = selectBox.getBoundingClientRect().top + liHeight * 1 + liHeight / 2;
      let closestLi = null;
      let closestDistance = Infinity;

      liList.forEach(li => {
        const liRect = li.getBoundingClientRect();
        const liCenterY = liRect.top + liRect.height / 2;
        const distance = Math.abs(baseY - liCenterY);
        if (distance < closestDistance) {
          closestDistance = distance;
          closestLi = li;
        }
      });

      liList.forEach(li => li.classList.remove('active'));
      if (closestLi) closestLi.classList.add('active');
    };

    setTimeout(() => {
      liList = Array.from(ul.querySelectorAll('li'));
      updateActive();
    }, 20);

    let scrollTimeout;
    ul.addEventListener('scroll', () => {
      updateActive();

      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        const nearestIndex = Math.round(ul.scrollTop / liHeight);
        const snapScrollTop = nearestIndex * liHeight;
        ul.scrollTo({ top: snapScrollTop, behavior: 'smooth' });
      }, 100);
    });

    ul.querySelectorAll('li').forEach((li, i) => {
        li.addEventListener('click', () => {
            const scrollTo = liHeight * (ul.id === 'year' ? Math.max(i, 0) : Math.max(i - 1, 0));
            ul.scrollTo({ top: scrollTo, behavior: 'smooth' });

            liList.forEach(l => l.classList.remove('active'));
            li.classList.add('active');
        });
        });
  });
});

</script>

</body>
</html>
