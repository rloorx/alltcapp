<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/tablet.css">
    <title>메모장 확장화면</title>
</head>
<body>
    <div id="memo-expand">
        <div class="wrap">                
            <header class="header">
                <div class="header-in">
                    <div class="header-left">
                        <div class="thum">
                            <img src="./img/header/back-arrow.png">
                        </div>
                    </div>
                    <div class="header-tit">
                        <h5>메모 작성</h5>
                    </div>
                    <div class="header-right">
                        <div class="thum left" style="display: none;"> <!--아이콘 두개일때 활성화(display:none지우면됨)-->
                            <img src="./img/header/header-timer.png">
                        </div>
                        <div class="thum" style="display: none;"> <!--아이콘 한개일때 활성화-->
                            <img src="./img/header/search.png">
                        </div>
                        <p>삭제</p> <!--글자버튼일때 활성화-->
                        <select style="display: none;"> <!--랭킹 : 셀렉박스일때 활성화-->
                            <option value="default">광명점 랭킹</option>
                            <option value="state">신분</option>
                        </select>
                    </div>
                </div>
            </header>
            <div class="header-calender" style="display: none;">
                <div class="calendar-container">
                    <div class="calendar-header">
                      <button class="prev-month"><img src="./img/calender/calender-prev.png" /></button>
                      <span class="current-month">2025년 4월</span>
                      <button class="next-month"><img src="./img/calender/calender-next.png" /></button>
                    </div>
                  
                    <div class="weekday-header">
                      <div>월</div>
                      <div>화</div>
                      <div>수</div>
                      <div>목</div>
                      <div>금</div>
                      <div>토</div>
                      <div>일</div>
                    </div>
                  
                    <div class="calendar-wrapper">
                      <div class="calendar-slider"></div>
                    </div>
                  </div>
                <div class="calender-open">
                    <button type="button" class="cal-btn"></button>
                </div>    
            </div>

            <main class="main layout">
                <div class="bottom-menu">
                    <div class="bottom-in">
                        <div class="bottom-item on">
                            <img src="./img/bottom-menu/bottom-home-selected.png">
                            <p>홈</p>
                        </div>
                        <div class="bottom-item">
                            <img src="./img/bottom-menu/bottom-study.png">
                            <p>학습기록</p>
                        </div>
                        <div class="bottom-item">
                            <img src="./img/bottom-menu/bottom-content.png">
                            <p>콘텐츠</p>
                        </div>
                        <div class="bottom-item">
                            <img src="./img/bottom-menu/bottom-my.png">
                            <p>MY</p>
                        </div>
                    </div>
                </div>    
                <div class="main-con">
                    <div class="in">
                        <div class="sec-area">
                            <textarea name="memo-tit" class="memo-tit" placeholder="제목"></textarea>
                            <textarea name="memo-text" class="memo-txt" placeholder="메모 내용을 작성하세요."></textarea>
                        </div>
                    </div>
                    <div class="color-pick">
                        <div class="white on"></div>
                        <div class="pinkgra"></div>
                        <div class="greengra"></div>
                        <div class="yellowgra"></div>
                        <div class="bluegra"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>



<script>
    const textarea = document.querySelector('.memo-txt');
    const titlearea = document.querySelector('.memo-tit');

    textarea.addEventListener('input', () => {
        textarea.style.height = 'auto'; // 높이 초기화 (스크롤 줄이기 위해)
        textarea.style.height = textarea.scrollHeight + 'px'; // 실제 내용 높이만큼 조정
    });
    titlearea.addEventListener('input', () => {
        titlearea.style.height = 'auto'; // 높이 초기화 (스크롤 줄이기 위해)
        titlearea.style.height = titlearea.scrollHeight + 'px'; // 실제 내용 높이만큼 조정
    });


</script>

</body>
</html>
